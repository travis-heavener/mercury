# Nginx benchmark configuration for Mercury vs Apache & Nginx comparison
# Runs unprivileged without root

worker_processes 1;
pid logs/benchmark/nginx.pid;
error_log logs/benchmark/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    # Inline MIME types for standalone execution across platforms
    types {
        text/html html htm;
        text/plain txt;
        application/octet-stream bin;
        image/jpeg jpg jpeg;
        image/png png;
    }
    default_type application/octet-stream;

    # Access logging disabled during throughput benchmarks
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 5s;
    keepalive_requests 10000;

    # Unprivileged temporary paths
    client_body_temp_path logs/benchmark/nginx_client_body;
    proxy_temp_path logs/benchmark/nginx_proxy;
    fastcgi_temp_path logs/benchmark/nginx_fastcgi;
    uwsgi_temp_path logs/benchmark/nginx_uwsgi;
    scgi_temp_path logs/benchmark/nginx_scgi;

    server {
        listen 8084;
        server_name localhost;

        root tests/root;

        location / {
            index index.html index.htm;
        }
    }
}

