# Nginx benchmark configuration for Mercury vs Apache & Nginx comparison
# Runs unprivileged without root

worker_processes @WORKER_PROCESSES@;
pid "@REPO_ROOT@/logs/benchmark/nginx.pid";
error_log "@REPO_ROOT@/logs/benchmark/nginx_error.log" warn;

events {
    worker_connections @WORKER_CONNECTIONS@;
}

http {
    # Inline MIME types for standalone execution across platforms
    types {
        text/html html htm;
        text/plain txt;
        application/octet-stream bin;
        image/jpeg jpg jpeg;
        image/png png;
    }
    default_type application/octet-stream;

    # Access logging disabled during throughput benchmarks
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # In-memory file descriptor and metadata caching
    open_file_cache max=1024 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    keepalive_timeout 5s;
    keepalive_requests 10000;

    # Unprivileged temporary paths
    client_body_temp_path "@REPO_ROOT@/logs/benchmark/nginx_client_body";
    proxy_temp_path "@REPO_ROOT@/logs/benchmark/nginx_proxy";
    fastcgi_temp_path "@REPO_ROOT@/logs/benchmark/nginx_fastcgi";
    uwsgi_temp_path "@REPO_ROOT@/logs/benchmark/nginx_uwsgi";
    scgi_temp_path "@REPO_ROOT@/logs/benchmark/nginx_scgi";

    server {
        listen 127.0.0.1:8084;
        server_name localhost;

        root "@REPO_ROOT@/tests/root";

        location / {
            index index.html index.htm;
        }
    }
}

