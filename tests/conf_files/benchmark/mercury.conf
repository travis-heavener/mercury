<Mercury>
    <DocumentRoot> ./tests/root/ </DocumentRoot>

    <BindAddressIPv4> 127.0.0.1 </BindAddressIPv4>
    <BindAddressIPv6> off </BindAddressIPv6>

    <Port> 8080 </Port>
    <TLSPort> off </TLSPort>

    <EnableLegacyHTTPVersions> on </EnableLegacyHTTPVersions>

    <IndexFiles> index.html, index.htm </IndexFiles>
    <EnableCustomStatusDocs> off </EnableCustomStatusDocs>

    <!-- Substitute platform null device at runtime to discard access log writes -->
    <AccessLogFile> /dev/null </AccessLogFile>
    <ErrorLogFile> ./logs/benchmark/mercury_error.log </ErrorLogFile>

    <ClientSecurityMode> Minimal </ClientSecurityMode>
    <ClientSecurityIPSalt> fAhGD0OnCe4YhSyx </ClientSecurityIPSalt>

    <EnablePHPCGI> off </EnablePHPCGI>
    <EnableFastCGI> off </EnableFastCGI>

    <Match pattern=".*">
        <Header name="Cache-Control"> public, max-age=300 </Header>
        <ShowDirectoryIndexes> off </ShowDirectoryIndexes>
        <Access mode="deny all">
            <Allow> 127.0.0.1 </Allow>
            <Allow> ::1 </Allow>
        </Access>
    </Match>

    <KeepAlive> on </KeepAlive>
    <KeepAliveMaxTimeout> 5 </KeepAliveMaxTimeout>
    <KeepAliveMaxRequests> 10000 </KeepAliveMaxRequests>

    <MaxRequestLineLength> 4096 </MaxRequestLineLength>
    <MaxRequestBacklog> 1024 </MaxRequestBacklog>

    <RequestBufferSize> 16384 </RequestBufferSize>
    <ResponseBufferSize> 16384 </ResponseBufferSize>

    <MaxRequestBody> 268435456 </MaxRequestBody>
    <MaxResponseBody> 268435456 </MaxResponseBody>

    <MinResponseCompressionSize> 750 </MinResponseCompressionSize>

    <IdleThreadsPerChild> 10 </IdleThreadsPerChild>
    <MaxThreadsPerChild> 20 </MaxThreadsPerChild>

    <ShowWelcomeBanner> false </ShowWelcomeBanner>
    <ShowDonationBanner> false </ShowDonationBanner>
    <StartupCheckLatestRelease> false </StartupCheckLatestRelease>
</Mercury>
