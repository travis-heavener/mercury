# Generate absolute paths and module directives through benchmark runner
@LOAD_MODULES@
@RUN_AS_USER@

ServerName localhost
Listen 127.0.0.1:8082
PidFile "@REPO_ROOT@/logs/benchmark/apache.pid"
ErrorLog "@REPO_ROOT@/logs/benchmark/apache_error.log"
LogLevel warn

<IfModule !mpm_winnt_module>
    Mutex "file:@REPO_ROOT@/logs/benchmark" default
</IfModule>

# Match generated Mercury worker ceiling for requested client concurrency
<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 1
    MinSpareThreads 10
    MaxSpareThreads @WORKER_THREADS@
    ThreadLimit @WORKER_THREADS@
    ThreadsPerChild @WORKER_THREADS@
    MaxRequestWorkers @WORKER_THREADS@
</IfModule>
<IfModule mpm_winnt_module>
    ThreadsPerChild @WORKER_THREADS@
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive On
MaxKeepAliveRequests 10000
KeepAliveTimeout 5

TypesConfig "@REPO_ROOT@/tests/conf_files/benchmark/mime.types"
AddType text/html .html .htm
AddType text/plain .txt
AddType application/octet-stream .bin

DocumentRoot "@REPO_ROOT@/tests/root"
<Directory "@REPO_ROOT@/tests/root">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html index.htm
</Directory>
