# Apache benchmark configuration for Mercury vs Apache & Nginx comparison
# Runs unprivileged without root

ServerRoot "."
ServerName localhost

Listen 8082

PidFile logs/benchmark/apache.pid
Mutex file:logs/benchmark default
ErrorLog logs/benchmark/apache_error.log
LogLevel warn

# Dynamic module loading across common Linux distributions and Windows
<IfFile "/usr/lib/apache2/modules/mod_mpm_event.so">
    LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
</IfFile>
<IfFile "/usr/lib64/httpd/modules/mod_mpm_event.so">
    LoadModule mpm_event_module /usr/lib64/httpd/modules/mod_mpm_event.so
</IfFile>
<IfFile "/usr/lib/httpd/modules/mod_mpm_event.so">
    LoadModule mpm_event_module /usr/lib/httpd/modules/mod_mpm_event.so
</IfFile>
<IfFile "modules/mod_mpm_winnt.so">
    LoadModule mpm_winnt_module modules/mod_mpm_winnt.so
</IfFile>

# Authorization and directory modules
<IfFile "/usr/lib/apache2/modules/mod_authz_core.so">
    LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
</IfFile>
<IfFile "/usr/lib64/httpd/modules/mod_authz_core.so">
    LoadModule authz_core_module /usr/lib64/httpd/modules/mod_authz_core.so
</IfFile>
<IfFile "/usr/lib/httpd/modules/mod_authz_core.so">
    LoadModule authz_core_module /usr/lib/httpd/modules/mod_authz_core.so
</IfFile>
<IfFile "modules/mod_authz_core.so">
    LoadModule authz_core_module modules/mod_authz_core.so
</IfFile>

<IfFile "/usr/lib/apache2/modules/mod_dir.so">
    LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
</IfFile>
<IfFile "/usr/lib64/httpd/modules/mod_dir.so">
    LoadModule dir_module /usr/lib64/httpd/modules/mod_dir.so
</IfFile>
<IfFile "/usr/lib/httpd/modules/mod_dir.so">
    LoadModule dir_module /usr/lib/httpd/modules/mod_dir.so
</IfFile>
<IfFile "modules/mod_dir.so">
    LoadModule dir_module modules/mod_dir.so
</IfFile>

<IfFile "/usr/lib/apache2/modules/mod_mime.so">
    LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
</IfFile>
<IfFile "/usr/lib64/httpd/modules/mod_mime.so">
    LoadModule mime_module /usr/lib64/httpd/modules/mod_mime.so
</IfFile>
<IfFile "/usr/lib/httpd/modules/mod_mime.so">
    LoadModule mime_module /usr/lib/httpd/modules/mod_mime.so
</IfFile>
<IfFile "modules/mod_mime.so">
    LoadModule mime_module modules/mod_mime.so
</IfFile>

# MPM concurrency: fixed 10 threads matching Mercury baseline
<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 1
    MinSpareThreads 10
    MaxSpareThreads 10
    ThreadsPerChild 10
    MaxRequestWorkers 10
</IfModule>

<IfModule mpm_winnt_module>
    ThreadsPerChild 10
    MaxConnectionsPerChild 0
</IfModule>

# Keep-Alive parity
KeepAlive On
MaxKeepAliveRequests 10000
KeepAliveTimeout 5

# MIME types
<IfModule mime_module>
    TypesConfig /dev/null
    AddType text/html .html .htm
    AddType text/plain .txt
    AddType application/octet-stream .bin
</IfModule>

# Document root and access control
DocumentRoot "tests/root"

<Directory "tests/root">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html index.htm
</Directory>

