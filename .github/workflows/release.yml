name: Make New Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      hit: ${{ steps.check.outputs.hit }}
      run-id: ${{ steps.check.outputs.run-id }}
    steps:
      - uses: actions/checkout@v7

      # Find successful main push build for release commit
      - name: Find Existing Tested Build
        id: check
        uses: ./.github/actions/find-tested-build
        with:
          token: ${{ github.token }}
          sha: ${{ github.sha }}
          branch: main
          artifact-prefixes: '["mercury-x86_64-binaries-", "mercury-arm64-binaries-"]'

  release-build:
    needs: check-cache
    if: github.ref == 'refs/heads/main' && needs.check-cache.outputs.hit == 'false'
    uses: ./.github/workflows/build.yml

  deploy-release:
    needs: [check-cache, release-build]
    if: >
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.check-cache.result == 'success' &&
      (
        needs.check-cache.outputs.hit == 'true' ||
        needs.release-build.result == 'success'
      )
    runs-on: ubuntu-24.04
    env:
      BUILD_RUN_ID: ${{ needs.check-cache.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MERCURY_BOT_APP_ID }}
          private-key: ${{ secrets.MERCURY_BOT_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set User
        run: |
          git config user.name "Mercury Actions Bot"
          git config user.email "mercury-actions-bot[bot]@users.noreply.github.com"

      # Download tested binaries from selected build run
      - name: Download x86_64 Binaries
        uses: actions/download-artifact@v7
        with:
          name: mercury-x86_64-binaries-${{ env.BUILD_RUN_ID }}
          path: ./bin/x86_64
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Download ARM64 Binaries
        uses: actions/download-artifact@v7
        with:
          name: mercury-arm64-binaries-${{ env.BUILD_RUN_ID }}
          path: ./bin/arm64
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN_ID }}

      # Run release builder
      - name: Make Release
        run: bash ./build_tools/release.sh --ci-artifacts

      # Read version from version.txt
      - name: Extract Version
        id: version
        run: |
          VERSION=$(sed 's/^Mercury //' version.txt | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Delete existing release if it exists
      - name: Delete Existing Release If Exists
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "Cleaning up release and tag for $VERSION"

          # Delete release if it exists
          gh release delete "$VERSION" -y || echo "No release to delete"

          # Delete remote tag if it exists
          git push origin ":refs/tags/$VERSION" || echo "No remote tag to delete"

          # Delete local tag if it exists
          git tag -d "$VERSION" || echo "No local tag to delete"

          # Confirm cleanup
          gh release list --limit 5
          git ls-remote --tags origin | grep "$VERSION" || echo "Remote tag is gone"

      # Create GitHub Release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_NAME="${VERSION//./_}"
          SUMMARY_FILE="./releases/SUMMARY_$RELEASE_NAME.md"
          ARCHIVES=(
            "./releases/Linux_$RELEASE_NAME.tar.gz"
            "./releases/Windows_$RELEASE_NAME.zip"
            "./releases/Mercury_ARM64_$RELEASE_NAME.tar.gz"
            "./releases/Mercury_ARM64_$RELEASE_NAME.zip"
          )

          # Determine if this is a pre-release (v0.*.*)
          if [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi

          # Create release (tag is the version only, title keeps "Mercury vX.X.X")
          gh release create "$VERSION" "${ARCHIVES[@]}" \
            --target "${{ github.sha }}" \
            --title "Mercury $VERSION" \
            --notes-file "$SUMMARY_FILE" \
            $PRERELEASE

      # Commit and push release metadata directly to main
      - name: Push Release Metadata Update
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add website/releases.json website/latest
          git commit -m "Update release metadata for ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:main
