name: Test Runner (Windows)

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string

jobs:
  Test-Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Download binaries
      - name: Cache Windows Binaries
        uses: actions/cache@v6
        with:
          path: ./bin/mercury.exe
          key: mercury-windows-binaries-${{ github.sha }}
          enableCrossOsArchive: true

      - name: Copy Default Config
        run: |
          Copy-Item ./conf/default/mimes.conf ./conf/mimes.conf
          Copy-Item ./conf/default/mercury.conf ./conf/mercury.conf

      - name: Install Python Deps
        run: python -m pip install --upgrade "brotli>=1.2.1" zstandard psutil

      - name: Setup PHP
        run: |
          ./conf/setup_php.ps1
          & ./php/php-cgi.exe -v

      # Install postmortem capture before short-lived PHP workers start
      - name: Enable Windows Crash Dumps
        shell: pwsh
        run: |
          $dumpFolder = Join-Path $env:GITHUB_WORKSPACE 'crash-dumps'
          New-Item -Path $dumpFolder -ItemType Directory -Force | Out-Null
          $toolFolder = Join-Path $env:RUNNER_TEMP 'mercury-procdump'
          $archive = Join-Path $env:RUNNER_TEMP 'mercury-procdump.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $toolFolder -Force
          $procDump = Join-Path $toolFolder 'procdump64.exe'
          & $procDump -accepteula -ma -i $dumpFolder
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to install ProcDump postmortem capture.'
          }

      # Make TLS cert
      - name: Make TLS Cert
        run: |
          openssl req -x509 -newkey rsa:4096 -keyout conf/ssl/key.pem -out conf/ssl/cert.pem -sha256 -days 1 -nodes -subj "/C=XX/ST=New York/L=NYC/O=The Mercury Project/OU=GitHub Action Runner/CN=The Mercury Developers"

      # Run Python test cases
      - name: Python Test Runner
        run: |
          # Clear inherited crash-dialog suppression so postmortem debugger can run
          python -c "import ctypes, pathlib, runpy, sys; ctypes.windll.kernel32.SetErrorMode(1); sys.path.insert(0, str(pathlib.Path('tests').resolve())); runpy.run_path('tests/run.py', run_name='__main__')"
          $status=$LastExitCode

          # Print logs
          Write-Host "====================================================="
          Write-Host "                     Error Log"
          Write-Host "====================================================="
          if (Test-Path 'logs/error.log') {
            Get-Content -Path 'logs/error.log'
          }

          # Exit with status code
          exit $status

      # Collect Windows crash reports without masking original test result
      - name: Windows Crash Diagnostics
        if: failure()
        shell: pwsh
        run: |
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            Id = 1000, 1001
            StartTime = (Get-Date).AddHours(-1)
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.Message -match 'mercury\.exe|php-cgi\.exe|php_opcache\.dll'
          }
          if ($events) {
            $events | Format-List TimeCreated, Id, ProviderName, Message |
              Out-String -Width 300 | Tee-Object -FilePath 'crash-dumps/application-events.txt'
          } else {
            'No matching Windows application crash events found.' |
              Tee-Object -FilePath 'crash-dumps/application-events.txt'
          }
          $dumps = @(Get-ChildItem -Path 'crash-dumps' -Filter '*.dmp')
          $dumps | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
          if ($dumps.Count -eq 0) {
            'No crash dumps were captured.' | Tee-Object -FilePath 'crash-dumps/capture-status.txt'
          }
          exit 0

      # Restore postmortem debugger settings even when tests fail
      - name: Remove Windows Crash Capture
        if: always()
        shell: pwsh
        run: |
          $procDump = Join-Path $env:RUNNER_TEMP 'mercury-procdump/procdump64.exe'
          if (Test-Path $procDump) {
            & $procDump -accepteula -u
            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'ProcDump cleanup failed on disposable CI runner.'
            }
          }
          exit 0

      # Preserve dumps alongside exact binaries and configuration needed for analysis
      - name: Upload Windows Crash Diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-crash-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            crash-dumps/
            logs/
            bin/mercury.exe
            php/php-cgi.exe
            php/php8*.dll
            php/ext/php_opcache.dll
            php/php.ini
            php/mercury-cgi.ini
            build_tools/dependencies.txt
            libs/artifacts.lock
