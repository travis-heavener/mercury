name: Test Runner

on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      linux-runner:
        required: true
        type: string
      windows-runner:
        required: true
        type: string
      debug:
        required: false
        type: boolean
        default: false

jobs:
  #############################################################################################
  ################                            Linux                            ################
  #############################################################################################
  Run-Tests-Linux:
    runs-on: ${{ inputs.linux-runner }} # <--- Use 24.04 instead of 22.04 since python3-zstandard does not have a mirror
    steps:
      - uses: actions/checkout@v7

      # Install & cache APT deps
      - name: Refresh APT Package Lists
        run: sudo apt-get update

      - name: Install Deps
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: php-cgi php-fpm python3-zstandard python3-brotli libbrotli1 python3-psutil
          version: 1.2

      # Download the binary
      - name: Download Binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ./bin

      # Configure the test environment (chmod +x, copy mimes.conf, TLS cert)
      - name: Configure Test Environment
        run: |
          chmod +x ./bin/mercury
          cp conf/default/mimes.conf conf/mimes.conf
          openssl req -x509 \
            -newkey rsa:4096 \
            -keyout conf/ssl/key.pem \
            -out conf/ssl/cert.pem \
            -sha256 \
            -days 1 \
            -nodes \
            -subj "/C=XX/ST=New York/L=NYC/O=The Mercury Project/OU=GitHub Action Runner/CN=The Mercury Developers"

      # Invoke the test suite
      - name: Python Test Runner
        run: python3 tests/run.py

      # Print diagnostics even when the test command fails
      - name: Dump Error Logs
        if: always()
        run: if [ -f tests/logs/error.log ]; then cat tests/logs/error.log; fi

  #############################################################################################
  ################                            Windows                          ################
  #############################################################################################
  Run-Tests-Windows:
    runs-on: ${{ inputs.windows-runner }}
    steps:
      - uses: actions/checkout@v7

      # Download dependencies
      - name: Install Python Deps
        run: python -m pip install --upgrade "brotli>=1.2.1" zstandard psutil

      # Download the binary
      - name: Download Binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ./bin

      # Configure the test environment (copy mimes.conf, TLS cert)
      - name: Configure Test Environment
        run: |
          Copy-Item ./conf/default/mimes.conf ./conf/mimes.conf
          openssl req -x509 -newkey rsa:4096 -keyout conf/ssl/key.pem -out conf/ssl/cert.pem -sha256 -days 1 -nodes -subj "/C=XX/ST=New York/L=NYC/O=The Mercury Project/OU=GitHub Action Runner/CN=The Mercury Developers"

      # Get current ISO week for weekly cache rotation
      - name: Get Current Week
        id: get-week
        shell: pwsh
        run: |
          $week = Get-Date -UFormat "%Y-%W"
          echo "week=$week" >> $env:GITHUB_OUTPUT

      # Cache PHP installation for one week to avoid rate limiting
      - name: Cache PHP Installation
        id: cache-php
        uses: actions/cache@v6
        with:
          path: ./php
          key: ${{ runner.os }}-php-${{ runner.arch }}-week-${{ steps.get-week.outputs.week }}-${{ hashFiles('conf/setup_php.ps1') }}

      - name: Configure PHP
        uses: ./.github/actions/configure-windows-php

      # Enable crash diag on x86_64 only
      - name: Enable Crash Dumps & PageHeap
        if: ${{ runner.arch == 'X64' }}
        uses: ./.github/actions/enable-windows-diag
        with:
          debug: ${{ inputs.debug }}

      # Run Python test cases
      - name: Python Test Runner
        run: |
          # Clear inherited crash-dialog suppression so postmortem debugger can run
          python -c "import ctypes, pathlib, runpy, sys; ctypes.windll.kernel32.SetErrorMode(1); sys.path.insert(0, str(pathlib.Path('tests').resolve())); runpy.run_path('tests/run.py', run_name='__main__')"
          $status=$LastExitCode

          # Print logs
          Write-Host "====================================================="
          Write-Host "                     Error Log"
          Write-Host "====================================================="
          if (Test-Path 'tests/logs/error.log') {
            Get-Content -Path 'tests/logs/error.log'
          }

          # Exit with test suite's status code
          exit $status

      # Collect any crash diagnostics, if failed
      - name: Collect Crash Diagnostics
        if: ${{ failure() && runner.arch == 'X64' }}
        uses: ./.github/actions/collect-windows-crash-diag

      # Clean up diagnostics
      - name: Disable Crash Dumps & PageHeap
        if: ${{ always() && runner.arch == 'X64' }}
        uses: ./.github/actions/disable-windows-diag
        with:
          debug: ${{ inputs.debug }}

      # Upload crash diagnostics, if failed
      - name: Upload Crash Diagnostics
        if: ${{ failure() && runner.arch == 'X64' }}
        uses: ./.github/actions/upload-windows-crash-diag
