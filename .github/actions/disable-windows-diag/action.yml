name: Disable Windows Diagnostics
description: Disable Windows Crash Dumps & PageHeap

inputs:
  debug:
    description: Disable PageHeap for debug builds
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Disable PageHeap even when tests fail
    - name: Disable PageHeap
      if: ${{ always() && inputs.debug == 'true' }}
      shell: pwsh
      run: |
        $gflags = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\gflags.exe" -ErrorAction SilentlyContinue |
          Select-Object -First 1 -ExpandProperty FullName
        if ($gflags) {
          & $gflags /p /disable mercury.exe
        }
        exit 0

    # Restore postmortem debugger settings even when tests fail
    - name: Remove Windows Crash Capture
      if: always()
      shell: pwsh
      run: |
        $procDump = Join-Path $env:RUNNER_TEMP 'mercury-procdump/procdump64.exe'
        if (Test-Path $procDump) {
          & $procDump -accepteula -u
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'ProcDump cleanup failed on disposable CI runner.'
          }
        }
        exit 0
